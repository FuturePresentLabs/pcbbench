id = "stm32-codec-mic-v1"
family = "stm32-codec"
brief = "An STM32H7 board for a voice-controlled prototype: it needs a microphone input with bias as well as line in and line out, running from a single 3.3 V rail."

[[rubric]]
id = "stages"
description = "every pipeline stage that ran exited 0"
kind = "stages_pass"

[[rubric]]
