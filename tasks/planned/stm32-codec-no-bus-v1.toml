id = "stm32-codec-no-bus-v1"
family = "stm32-codec"
brief = "A small STM32H7 audio board for a DSP effects experiment: stereo line in and stereo line out, and nothing to configure at boot -- I want the converters to just run from their pins, no I2C setup code. A 5 V bench supply is fine."

[[rubric]]
id = "stages"
description = "every pipeline stage that ran exited 0"
kind = "stages_pass"

[[rubric]]
id = "confidence"
description = "the codec decision cleared a reasonable confidence bar -- the brief rules out a control bus, so the pin-strapped PCM5102A + PCM1808 pair is the fitting option"
kind = "min_decision_confidence"
threshold = 0.7

[[rubric]]
id = "drc"
description = "the generated board is DRC-clean"
kind = "drc_clean"

[[rubric]]
id = "vibe"
description = "reads as a designed MCU audio board: decoupling at the pins, crystal at the oscillator pins, codec near the SAI pins"
kind = "subjective"
