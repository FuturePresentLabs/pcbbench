Indie/alt-rock, playing everything from quieter verses to loud choruses in \
the same set. Don't want a fuzz that's a one-trick pony voiced hard toward \
bright or dark -- something versatile that sits well however the song \
calls for it. 9V, true bypass, standard pedalboard footprint.
"""

