description = "the codec decision cleared a reasonable confidence bar -- a microphone input with bias points at the WM8731, the option with a mic input and MICBIAS"
kind = "min_decision_confidence"
threshold = 0.7

[[rubric]]
id = "drc"
description = "the generated board is DRC-clean"
kind = "drc_clean"

[[rubric]]
id = "vibe"
description = "reads as a designed MCU audio board: decoupling at the pins, crystal at the oscillator pins, codec near the SAI pins"
kind = "subjective"
