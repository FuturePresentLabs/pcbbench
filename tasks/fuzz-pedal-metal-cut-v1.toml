id = "fuzz-pedal-metal-cut-v1"
family = "fuzz-pedal"
brief = """
Playing in a metal band with two guitars and a five-string bass -- \
whatever fuzz I run needs to cut through that low end and stay audible in \
the mix, not get swallowed by it. Sharper, more aggressive top end is fine, \
even good. 9V, true bypass, standard footswitch enclosure.
"""

[[rubric]]
id = "stages"
description = "every pipeline stage that ran exited 0"
kind = "stages_pass"

[[rubric]]
id = "confidence"
description = "every typed decision cleared a reasonable confidence bar -- voice signaled indirectly (cuts through a dense low end, aggressive top end welcome)"
kind = "min_decision_confidence"
threshold = 0.7

[[rubric]]
id = "drc"
description = "the generated board is DRC-clean"
kind = "drc_clean"

[[rubric]]
id = "vibe"
description = "reads as a designed fuzz pedal, not a pile of parts"
kind = "subjective"
