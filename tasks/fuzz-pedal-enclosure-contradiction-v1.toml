id = "fuzz-pedal-enclosure-contradiction-v1"
family = "fuzz-pedal"
brief = """
Need this to fit on an already-packed pedalboard, so as compact as \
possible -- but I also want room inside for an extra trim pot and maybe a \
second footswitch down the line, so don't make it too cramped to work in. \
Silicon fuzz, middle-of-the-road voice, nothing extreme either bright or \
dark. 9V, true bypass.
"""

