id = "fuzz-pedal-symmetric-balanced-v1"
family = "fuzz-pedal"
brief = """
Want a fuzz that's even-handed -- not scooped and dark, not harsh and \
bright, just a balanced clipping character that doesn't lean hard toward \
either end. Should work across a few different guitars and amps without \
needing to be re-thought for each one. 9V, true bypass, standard \
footswitch enclosure.
"""

[[rubric]]
id = "stages"
description = "every pipeline stage that ran exited 0"
kind = "stages_pass"

[[rubric]]
id = "confidence"
description = "every typed decision cleared a reasonable confidence bar -- voice signaled toward the symmetric/balanced choice explicitly, unlike the bright/dark-leaning tasks"
kind = "min_decision_confidence"
threshold = 0.7

[[rubric]]
id = "drc"
description = "the generated board is DRC-clean"
kind = "drc_clean"

[[rubric]]
id = "vibe"
description = "reads as a designed fuzz pedal, not a pile of parts"
kind = "subjective"
