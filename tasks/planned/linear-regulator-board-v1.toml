id = "linear-regulator-board-v1"
family = "linear-regulator"
brief = """
A simple linear voltage regulator board: 9-12V DC input (wall adapter or \
battery pack), regulated 5V output at up to 500mA, with input reverse- \
polarity protection, an output indicator LED, and enough input/output \
bulk capacitance to keep the regulator stable and stay within its \
datasheet's recommended operating conditions. Through-hole, small \
two-layer board, screw terminals for input and output.
"""

