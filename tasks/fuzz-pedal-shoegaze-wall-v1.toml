id = "fuzz-pedal-shoegaze-wall-v1"
family = "fuzz-pedal"
brief = """
Shoegaze/ambient setup, everything runs through a wall of reverb and delay \
after this. Want the fuzz itself to be dark and smeared rather than sharp \
-- it's going to get washed out in the reverb tails anyway, so a bright \
buzzy top end just turns to noise back there. 9V adapter, true bypass. \
This pedal lives permanently on a big pedalboard so footprint isn't a big \
concern -- happy to have the larger enclosure if it means more room inside \
for future mods.
"""

[[rubric]]
id = "stages"
description = "every pipeline stage that ran exited 0"
kind = "stages_pass"

[[rubric]]
id = "confidence"
description = "every typed decision cleared a reasonable confidence bar -- voice (dark/smeared) and enclosure (larger, room for mods) both signaled indirectly"
kind = "min_decision_confidence"
threshold = 0.7

[[rubric]]
id = "drc"
description = "the generated board is DRC-clean"
kind = "drc_clean"

[[rubric]]
id = "vibe"
description = "reads as a designed fuzz pedal, not a pile of parts"
kind = "subjective"
