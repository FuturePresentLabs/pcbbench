id = "fuzz-pedal-ambiguous-voice-v1"
family = "fuzz-pedal"
brief = """
A silicon fuzz pedal. Should sound warm and vintage, but also needs an \
aggressive edge that cuts through a mix. 9V, true bypass.
"""

[[rubric]]
id = "stages"
description = "every pipeline stage that ran exited 0"
kind = "stages_pass"

[[rubric]]
id = "confidence"
description = "every typed decision cleared a reasonable confidence bar -- a stress test: warm/vintage and aggressive/cutting are in tension for the bias-voice decision, on purpose"
kind = "min_decision_confidence"
threshold = 0.7

[[rubric]]
id = "drc"
description = "the generated board is DRC-clean"
kind = "drc_clean"

[[rubric]]
id = "vibe"
description = "reads as a designed fuzz pedal, not a pile of parts"
kind = "subjective"
