[package]
name = "pcbbench"
version = "0.1.0"
edition = "2021"
description = "Eval harness for typed-decision-driven PCB design agents. EDA-tool-agnostic: drives a backend (legion-of-bom's `lob` CLI today) as a subprocess and scores its artifacts against a task's rubric."
license = "AGPL-3.0-or-later"

[lib]
name = "pcbbench"
path = "src/lib.rs"

[[bin]]
name = "pcbbench"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
